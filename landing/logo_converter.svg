<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1f26"/>
      <stop offset="100%" stop-color="#0b0d12"/>
    </linearGradient>

    <!-- Accent Gradient for Arrow & Highlights -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#FB923C"/>
    </linearGradient>

    <!-- Subtle Document Glow -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="arrowGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#F97316" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Squircle Base Tile -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bgGrad)" stroke="#2d333f" stroke-width="3"/>

  <!-- Left: Statement Document -->
  <g filter="url(#subtleGlow)">
    <!-- Document Body -->
    <path d="M100 130 C100 118 110 108 122 108 L200 108 L240 148 L240 380 C240 392 230 402 218 402 L122 402 C110 402 100 392 100 380 Z" fill="#F8FAFC"/>
    <!-- Folded Corner -->
    <path d="M200 108 L200 144 C200 146 202 148 204 148 L240 148 Z" fill="#CBD5E1"/>
    
    <!-- Mini PDF Icon Badge -->
    <rect x="120" y="136" width="34" height="24" rx="5" fill="#EF4444"/>
    <text x="137" y="153" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle">PDF</text>
    
    <!-- Document Text Lines -->
    <rect x="120" y="180" width="80" height="7" rx="3.5" fill="#94A3B8"/>
    <rect x="120" y="202" width="100" height="6" rx="3" fill="#CBD5E1"/>
    <rect x="120" y="222" width="95" height="6" rx="3" fill="#CBD5E1"/>
    <rect x="120" y="242" width="100" height="6" rx="3" fill="#CBD5E1"/>
    <rect x="120" y="262" width="85" height="6" rx="3" fill="#CBD5E1"/>
    <rect x="120" y="282" width="90" height="6" rx="3" fill="#CBD5E1"/>
    <rect x="120" y="302" width="70" height="6" rx="3" fill="#CBD5E1"/>

    <!-- Total Amount Strip -->
    <rect x="120" y="340" width="100" height="14" rx="4" fill="#E2E8F0"/>
    <rect x="165" y="344" width="45" height="6" rx="3" fill="#64748B"/>
  </g>

  <!-- Center: Conversion Chevron / Flow -->
  <g filter="url(#arrowGlow)">
    <path d="M228 256 L278 256 M264 240 L282 256 L264 272" stroke="url(#accentGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Right: Structured DATEV / BMD Ledger Grid (Muster) -->
  <g filter="url(#subtleGlow)">
    <!-- Table Container -->
    <rect x="272" y="108" width="140" height="294" rx="14" fill="#0F172A" stroke="#334155" stroke-width="2.5"/>

    <!-- Header Row (DATEV Orange Accent) -->
    <path d="M273 122 C273 114 279 109 286 109 L398 109 C405 109 411 114 411 122 L411 146 L273 146 Z" fill="#F97316"/>
    <text x="342" y="133" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">Buchungsdaten</text>

    <!-- Table Vertical Column Dividers -->
    <line x1="316" y1="146" x2="316" y2="370" stroke="#1E293B" stroke-width="2"/>
    <line x1="366" y1="146" x2="366" y2="370" stroke="#1E293B" stroke-width="2"/>

    <!-- Row 1 -->
    <rect x="282" y="162" width="26" height="6" rx="3" fill="#38BDF8"/>
    <rect x="324" y="162" width="34" height="6" rx="3" fill="#94A3B8"/>
    <rect x="374" y="162" width="28" height="6" rx="3" fill="#34D399"/>
    <line x1="273" y1="184" x2="411" y2="184" stroke="#1E293B" stroke-width="1.5"/>

    <!-- Row 2 -->
    <rect x="282" y="200" width="26" height="6" rx="3" fill="#38BDF8"/>
    <rect x="324" y="200" width="34" height="6" rx="3" fill="#94A3B8"/>
    <rect x="374" y="200" width="28" height="6" rx="3" fill="#34D399"/>
    <line x1="273" y1="222" x2="411" y2="222" stroke="#1E293B" stroke-width="1.5"/>

    <!-- Row 3 -->
    <rect x="282" y="238" width="26" height="6" rx="3" fill="#38BDF8"/>
    <rect x="324" y="238" width="34" height="6" rx="3" fill="#94A3B8"/>
    <rect x="374" y="238" width="28" height="6" rx="3" fill="#34D399"/>
    <line x1="273" y1="260" x2="411" y2="260" stroke="#1E293B" stroke-width="1.5"/>

    <!-- Row 4 -->
    <rect x="282" y="276" width="26" height="6" rx="3" fill="#38BDF8"/>
    <rect x="324" y="276" width="34" height="6" rx="3" fill="#94A3B8"/>
    <rect x="374" y="276" width="28" height="6" rx="3" fill="#34D399"/>
    <line x1="273" y1="298" x2="411" y2="298" stroke="#1E293B" stroke-width="1.5"/>

    <!-- Row 5 -->
    <rect x="282" y="314" width="26" height="6" rx="3" fill="#38BDF8"/>
    <rect x="324" y="314" width="34" height="6" rx="3" fill="#94A3B8"/>
    <rect x="374" y="314" width="28" height="6" rx="3" fill="#34D399"/>
    <line x1="273" y1="336" x2="411" y2="336" stroke="#1E293B" stroke-width="1.5"/>

    <!-- Row 6 -->
    <rect x="282" y="352" width="26" height="6" rx="3" fill="#38BDF8"/>
    <rect x="324" y="352" width="34" height="6" rx="3" fill="#94A3B8"/>
    <rect x="374" y="352" width="28" height="6" rx="3" fill="#34D399"/>
    <line x1="273" y1="374" x2="411" y2="374" stroke="#1E293B" stroke-width="1.5"/>

    <!-- Footer Ready Check -->
    <circle cx="342" cy="389" r="6" fill="#10B981"/>
  </g>
</svg>
